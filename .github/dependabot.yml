version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "actions/checkout"
        versions: [">=6.0.3"]
      - dependency-name: "actions/setup-python"
        versions: [">=6.3.0"]
